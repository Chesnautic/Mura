# electron-builder config for the Mura desktop app.
#
# Kept as a separate file (rather than package.json's "build" field) so it
# can safely override "main" via extraMetadata: the root package.json's
# "main" field ("index.ts") has to stay pointed at the Expo/Metro app entry
# for `npx expo start` / Expo Go / native builds to keep working -- this file
# is the only place the *packaged desktop app* is told to actually boot from
# electron/main.js instead.
appId: com.mura.desktop
productName: Mura
directories:
  output: dist-electron

# assets/icon.png is the same 1024x1024 source the mobile app icon comes
# from (tools/generate_icon.py). electron-builder converts a single PNG at
# this resolution into whatever each platform actually needs (.icns for
# mac, .ico for Windows); Linux uses the PNG directly. Without this,
# electron-builder falls back to the generic Electron icon everywhere --
# the installer, the taskbar, the dock -- which is the "icon isn't there"
# problem.
icon: assets/icon.png

extraMetadata:
  main: electron/main.js

# We're not setting up auto-update feeds (that needs a "repository" field in
# package.json and a real publish target) -- just plain downloadable
# installers attached to GitHub Releases by the CI workflow. Without this,
# electron-builder still tries to compute update-feed metadata for a
# "repository" it can't find and crashes outright (`Cannot read properties
# of null (reading 'channel')`) instead of just skipping it.
publish: null

# Only what the packaged app actually runs needs to ship: the pre-bundled
# web build (dist/, produced by `npm run build:web`), the Electron
# main/preload scripts, and the two packages whose real binaries the main
# process spawns (ffmpeg-static/ffprobe-static). Every other entry in
# package.json's "dependencies" (expo, react-native, all the RN native
# modules) is already baked into dist/'s single JS bundle by Metro and isn't
# needed as a physical node_modules package at runtime -- excluding them
# keeps installers from ballooning to hundreds of MB of unused source.
files:
  - dist/**
  - electron/**
  - assets/icon.png
  - "!node_modules/**"
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**

asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**

mac:
  category: public.app-category.music
  target:
    - target: dmg
      arch: [x64, arm64]
win:
  target:
    - target: nsis
      arch: [x64]
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: AudioVideo

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
